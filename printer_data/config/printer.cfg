[printer]
kinematics: corexy
max_velocity: 300  
max_accel: 10000
max_z_velocity: 30 #15   #Max 15 for 12V TMC Drivers, can increase for 24V
max_z_accel: 350
square_corner_velocity: 5.0

[virtual_sdcard]
path: ~/printer_data/gcodes
[display_status]
[pause_resume]
[skew_correction]
[input_shaper]
[force_move]
enable_force_move: True
[exclude_object]
[gcode_arcs]
resolution: 0.25


