
[include mainboard.cfg]
[include cart.cfg]
[include x.cfg]
[include y.cfg]
[include z.cfg]
[include e.cfg]
#[include probe.cfg]
[include macros.cfg]
[include KAMP_Settings.cfg]
[include nitehawk.cfg]
#[include display.cfg]
[include fan.cfg]
[include stealthburner.cfg]

[printer]
kinematics: corexy
max_velocity: 300  
max_accel: 10000
max_z_velocity: 30 #15   #Max 15 for 12V TMC Drivers, can increase for 24V
max_z_accel: 350
square_corner_velocity: 5.0

[virtual_sdcard]
path: ~/printer_data/gcodes
[display_status]
[pause_resume]
[skew_correction]
[input_shaper]
[force_move]
enable_force_move: True
[exclude_object]
[gcode_arcs]
resolution: 0.25


###################
#   LED Control
###################

## Connected to LED-STRIP
[output_pin caselight]
pin: PE6
pwm:true
hardware_pwm: False
value: 0.20 #startup value
shutdown_value: 0
value:1
cycle_time: 0.00025

