########################################
# Stepper + Driver
########################################

[tmc2209 stepper_c] #formerly z
uart_pin: PC11
tx_pin: PC10
uart_address: 2
run_current: 0.850
diag_pin: PC2
interpolate: false
driver_SGTHRS: 10
stealthchop_threshold: 999999


[stepper_c]
step_pin: PB0
dir_pin: PC5
enable_pin: !PB1
microsteps: 16
rotation_distance: 40
full_steps_per_rotation: 200
#endstop_pin: probe:z_virtual_endstop
endstop_pin: tmc2209_stepper_c:virtual_endstop
